<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Entrar · Ponto CNA Taquara</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/cna.css">
<style>

html,body{height:100%}
body{display:grid; place-items:center; padding:22px; background:var(--superficie)}
.painel{width:100%; max-width:390px; background:var(--branco);
  border:1px solid var(--linha); border-top:3px solid var(--vermelho);
  border-radius:12px; box-shadow:var(--sombra); padding:34px 30px 28px}
.painel .marca{margin-bottom:26px}
h1{font-size:29px; font-weight:600; margin:0 0 5px}
.sub{font-size:14.5px; color:var(--cinza); line-height:1.5; margin-bottom:26px}
button.acao{width:100%; margin-top:10px; padding:14px}
.recado{margin-top:15px; font-size:13.5px; line-height:1.5; color:var(--cinza); min-height:1.4em}
.recado.erro{color:var(--vermelho-escuro)}
.rodape{margin-top:24px; padding-top:17px; border-top:1px solid var(--linha);
  font-size:12.5px; color:var(--cinza); line-height:1.55}

</style>
</head>
<body>

<main class="painel">
  <div class="marca"><img class="colorida" src="./assets/logo-cna.png" alt="CNA Idiomas" onerror="this.dataset.falhou=1"><img class="branca" src="./assets/logo-cna-branca.png" alt="CNA Idiomas" onerror="this.dataset.falhou=1"><span class="lockup"><b>CNA</b> <i>idiomas</i></span><span class="unidade">Taquara</span></div>
  <h1>Ponto</h1>
  <p class="sub">Entre com o e-mail que a coordenação cadastrou para você.</p>

  <label class="campo">
    <span>E-mail</span>
    <input type="email" id="email" autocomplete="username" inputmode="email" autocapitalize="off">
  </label>
  <label class="campo">
    <span>Senha</span>
    <input type="password" id="senha" autocomplete="current-password">
  </label>

  <button class="acao" id="entrar">Entrar</button>
  <p class="recado" id="recado"></p>

  <p class="rodape">
    Esqueceu a senha ou ainda não tem acesso? Fale com a coordenação —
    a conta é criada por lá, não por aqui.
  </p>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CFG = {
  url:  'https://snipevyvfxaotjhnabmx.supabase.co',
  anon: 'sb_publishable_T0rV6HAXusL_3J3Yzh-P_Q_CieYFkjA',
};
const sb = createClient(CFG.url, CFG.anon);
const $ = (id) => document.getElementById(id);

// De onde a pessoa veio, para devolver ao lugar certo depois de entrar.
const destino = new URLSearchParams(location.search).get('para') || './';

async function entrar(){
  const btn = $('entrar'), recado = $('recado');
  const email = $('email').value.trim().toLowerCase();
  const senha = $('senha').value;

  if (!email || !senha){
    recado.className = 'recado erro';
    recado.textContent = 'Preencha o e-mail e a senha.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Entrando…';
  recado.className = 'recado'; recado.textContent = '';

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });

  if (error){
    recado.className = 'recado erro';
    recado.textContent = /invalid login/i.test(error.message)
      ? 'E-mail ou senha não conferem.'
      : /confirm/i.test(error.message)
        ? 'Esta conta ainda não foi confirmada. Peça à coordenação.'
        : error.message;
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  location.replace(destino);
}

$('entrar').addEventListener('click', entrar);
['email','senha'].forEach((id) =>
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); }));

// Já logado? Não faz sentido mostrar a tela de login.
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if (session) location.replace(destino);
  else $('email').focus();
})();
</script>
</body>
</html>

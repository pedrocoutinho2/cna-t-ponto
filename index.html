<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8E2D4">
<title>Ponto · CNA Taquara</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#E8E2D4; --papel-2:#F3EEE3; --tinta:#171B24; --tinta-fraca:#6B6F78;
  --carimbo:#1E6B57; --alerta:#A8431C; --linha:#C6BCA6;
  --perfuro:#D6CEBB;
  --serif:'Instrument Sans',system-ui,sans-serif;
  --mono:'Azeret Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--papel); color:var(--tinta); font-family:var(--serif);
  display:flex; align-items:stretch; justify-content:center;
  padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);
  overflow:hidden;
}

/* ---- o cartão de ponto: elemento central da interface ---- */
.cartao{
  width:100%; max-width:430px; margin:14px 0;
  background:var(--papel-2);
  border:1px solid var(--linha);
  border-radius:3px;
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  box-shadow:0 1px 0 rgba(23,27,36,.06), 0 18px 40px -28px rgba(23,27,36,.5);
}
/* borda perfurada: a marca do cartão de ponto mecânico */
.cartao::before,.cartao::after{
  content:''; position:absolute; left:0; right:0; height:14px;
  background-image:radial-gradient(circle at 7px 7px, var(--perfuro) 3px, transparent 3.4px);
  background-size:19px 14px; opacity:.9; pointer-events:none;
}
.cartao::before{top:0}
.cartao::after{bottom:0; transform:rotate(180deg)}

.topo{padding:30px 24px 0; display:flex; justify-content:space-between; align-items:baseline}
.unidade{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta-fraca)}
.pessoa{font-size:11px; letter-spacing:.04em; color:var(--tinta-fraca); text-align:right}

/* ---- relógio ---- */
.relogio{padding:18px 24px 6px}
.hora{
  font-family:var(--mono); font-weight:700; font-size:clamp(52px,17vw,72px);
  letter-spacing:-.045em; line-height:.9; font-variant-numeric:tabular-nums;
}
.hora .seg{font-size:.42em; font-weight:400; color:var(--tinta-fraca); letter-spacing:-.01em}
.data{font-family:var(--mono); font-size:11px; color:var(--tinta-fraca); margin-top:9px; letter-spacing:.02em}

/* ---- janela da câmera ---- */
.janela{
  margin:16px 24px 0; position:relative; border-radius:2px; overflow:hidden;
  background:#0E1117; aspect-ratio:4/3; border:1px solid var(--linha);
}
.janela video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.janela.oculta{display:none}
.mira{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
}
.mira svg{width:62%; max-width:190px; opacity:.55}
.instrucao{
  position:absolute; left:0; right:0; bottom:0; padding:14px 16px;
  background:linear-gradient(transparent,rgba(14,17,23,.92));
  color:#F3EEE3; font-size:15px; font-weight:500; text-align:center; line-height:1.3;
}
.contador{
  position:absolute; top:10px; right:12px; font-family:var(--mono); font-size:11px;
  color:#F3EEE3; background:rgba(14,17,23,.6); padding:3px 7px; border-radius:2px;
}

/* ---- pauta do cartão (linhas de registro) ---- */
.pauta{flex:1; margin:16px 24px 0; min-height:0; overflow:auto}
.pauta h2{
  font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--tinta-fraca); font-weight:500; padding-bottom:7px;
  border-bottom:1px solid var(--linha);
}
.batida{
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline;
  padding:9px 0; border-bottom:1px solid rgba(198,188,166,.45);
  font-family:var(--mono); font-size:12.5px;
}
.batida .nsr{color:var(--tinta-fraca); font-size:10px}
.batida .sinal{font-size:9px; letter-spacing:.08em; text-transform:uppercase}
.sinal.ok{color:var(--carimbo)} .sinal.rev{color:var(--alerta)}
.vazio{padding:22px 0; color:var(--tinta-fraca); font-size:13.5px; line-height:1.5}

/* ---- ação ---- */
.acao{padding:14px 24px 26px}
button.bater{
  width:100%; border:0; border-radius:2px; cursor:pointer;
  background:var(--tinta); color:var(--papel-2);
  font-family:var(--serif); font-size:16px; font-weight:600; letter-spacing:.01em;
  padding:19px; transition:transform .12s ease, background .2s ease;
}
button.bater:active{transform:scale(.985)}
button.bater:disabled{background:var(--tinta-fraca); cursor:default}
button.bater:focus-visible{outline:2px solid var(--carimbo); outline-offset:3px}
.aviso{margin-top:11px; font-size:12px; line-height:1.45; color:var(--tinta-fraca); text-align:center}
.aviso.erro{color:var(--alerta)}

/* ---- o carimbo: assinatura visual da tela ---- */
.carimbo{
  position:fixed; inset:0; background:rgba(232,226,212,.96);
  display:none; place-items:center; padding:20px; z-index:20;
}
.carimbo.aberto{display:grid}
.recibo{
  width:100%; max-width:340px; background:var(--papel-2);
  border:1px solid var(--linha); padding:32px 26px 26px; position:relative;
  animation:prensa .5s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes prensa{
  0%{transform:scale(1.5) rotate(-7deg); opacity:0}
  55%{transform:scale(.97) rotate(1.2deg); opacity:1}
  100%{transform:scale(1) rotate(0); opacity:1}
}
.recibo .selo{
  position:absolute; top:-22px; right:18px;
  width:76px; height:76px; border:2.5px solid var(--carimbo); border-radius:50%;
  display:grid; place-items:center; text-align:center; transform:rotate(-13deg);
  color:var(--carimbo); font-family:var(--mono); font-size:8.5px; font-weight:700;
  letter-spacing:.06em; line-height:1.25; background:var(--papel-2);
  animation:bate .45s .18s cubic-bezier(.2,1.8,.4,1) both;
}
@keyframes bate{0%{transform:rotate(-13deg) scale(2.2);opacity:0}100%{transform:rotate(-13deg) scale(1);opacity:1}}
.recibo h3{font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--tinta-fraca); font-weight:500}
.recibo .marca{font-family:var(--mono); font-size:40px; font-weight:700; letter-spacing:-.04em; margin:9px 0 3px}
.recibo dl{margin-top:20px; border-top:1px solid var(--linha); padding-top:14px; font-family:var(--mono); font-size:10.5px}
.recibo dt{color:var(--tinta-fraca); font-size:8px; letter-spacing:.12em; text-transform:uppercase; margin-top:11px}
.recibo dd{margin-top:2px; word-break:break-all; line-height:1.45}
.recibo .botoes{display:flex; gap:9px; margin-top:22px}
.recibo button{
  flex:1; padding:13px; border:1px solid var(--tinta); background:transparent;
  color:var(--tinta); font-family:var(--serif); font-size:13px; font-weight:500;
  border-radius:2px; cursor:pointer;
}
.recibo button.principal{background:var(--tinta); color:var(--papel-2)}
.recibo .revisao{
  margin-top:14px; padding:11px 12px; border-left:2.5px solid var(--alerta);
  background:rgba(168,67,28,.06); font-size:12px; line-height:1.45; color:var(--tinta);
}

@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<main class="cartao">
  <header class="topo">
    <span class="unidade">CNA Taquara</span>
    <span class="pessoa" id="pessoa">—</span>
  </header>

  <section class="relogio">
    <div class="hora" id="hora">--:--<span class="seg">:--</span></div>
    <div class="data" id="data">—</div>
  </section>

  <div class="janela oculta" id="janela">
    <video id="video" playsinline muted autoplay></video>
    <div class="mira">
      <svg viewBox="0 0 200 200" fill="none" stroke="#F3EEE3" stroke-width="1.5">
        <path d="M100 22c30 0 48 24 48 60 0 42-22 74-48 74s-48-32-48-74c0-36 18-60 48-60Z"/>
      </svg>
    </div>
    <span class="contador" id="contador"></span>
    <p class="instrucao" id="instrucao">Enquadre o rosto</p>
  </div>

  <section class="pauta">
    <h2>Marcações de hoje</h2>
    <div id="lista"><p class="vazio">Nenhuma marcação registrada hoje.</p></div>
  </section>

  <footer class="acao">
    <button class="bater" id="registrar-aparelho" hidden>Registrar este celular</button>
    <button class="bater" id="bater">Bater ponto</button>
    <p class="aviso" id="aviso">O horário registrado é o do servidor, não o do aparelho.</p>
    <p class="aviso" style="margin-top:6px"><a href="./admin.html" style="color:var(--tinta-fraca)">Administração</a></p>
  </footer>
</main>

<div class="carimbo" id="carimbo" role="dialog" aria-modal="true" aria-labelledby="rec-titulo">
  <div class="recibo">
    <div class="selo" id="selo">REGISTRADO</div>
    <h3 id="rec-titulo">Comprovante de registro de ponto</h3>
    <p class="marca" id="rec-hora">--:--</p>
    <p style="font-size:12.5px;color:var(--tinta-fraca)" id="rec-data"></p>
    <div id="rec-revisao"></div>
    <dl>
      <dt>NSR</dt><dd id="rec-nsr"></dd>
      <dt>Trabalhador</dt><dd id="rec-nome"></dd>
      <dt>Código hash (SHA-256)</dt><dd id="rec-hash"></dd>
    </dl>
    <div class="botoes">
      <button id="rec-pdf">Baixar PDF</button>
      <button class="principal" id="rec-fechar">Concluir</button>
    </div>
  </div>
</div>

<script type="module">
import * as faceapi from 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.esm.js';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { startAuthentication, startRegistration } from 'https://esm.sh/@simplewebauthn/browser@13';

const CFG = {
  supabaseUrl: 'https://snipevyvfxaotjhnabmx.supabase.co',
  supabaseAnon: 'sb_publishable_T0rV6HAXusL_3J3Yzh-P_Q_CieYFkjA',
  modelos: './models',           // pesos do face-api hospedados junto ao PWA
  tz: 'America/Sao_Paulo',
};

const sb = createClient(CFG.supabaseUrl, CFG.supabaseAnon);
const $ = (id) => document.getElementById(id);

const TEXTO_ACAO = {
  piscar:         'Pisque os dois olhos',
  virar_direita:  'Vire o rosto para a direita',
  virar_esquerda: 'Vire o rosto para a esquerda',
  aproximar:      'Aproxime o rosto da câmera',
  sorrir:         'Sorria',
};

let stream = null, modelosProntos = false;

/* ---------- relógio: sempre corrigido pelo servidor ---------- */
let desvioMs = 0;
async function sincronizarRelogio(){
  const t0 = Date.now();
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/`, { method:'HEAD' });
  const servidor = new Date(r.headers.get('date')).getTime();
  desvioMs = servidor + (Date.now() - t0)/2 - Date.now();
}
function agora(){ return new Date(Date.now() + desvioMs); }

function pintarRelogio(){
  const d = agora();
  const f = (o) => new Intl.DateTimeFormat('pt-BR',{timeZone:CFG.tz,...o}).format(d);
  $('hora').innerHTML =
    f({hour:'2-digit',minute:'2-digit',hour12:false}) +
    `<span class="seg">:${f({second:'2-digit'}).padStart(2,'0')}</span>`;
  $('data').textContent =
    f({weekday:'long',day:'2-digit',month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
}
setInterval(pintarRelogio, 1000); pintarRelogio();

/* ---------- geometria do rosto ---------- */
function yawGraus(pontos){
  const olhoE = pontos[36], olhoD = pontos[45], nariz = pontos[30];
  const meio = (olhoE.x + olhoD.x)/2;
  const largura = Math.abs(olhoD.x - olhoE.x) || 1;
  return ((nariz.x - meio) / largura) * 90;
}
function ear(p, i){
  const d = (a,b)=>Math.hypot(p[a].x-p[b].x, p[a].y-p[b].y);
  return i === 'esq'
    ? (d(37,41)+d(38,40)) / (2*d(36,39))
    : (d(43,47)+d(44,46)) / (2*d(42,45));
}

/* ---------- câmera ---------- */
async function abrirCamera(){
  if (!modelosProntos){
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(CFG.modelos),
      faceapi.nets.faceLandmark68Net.loadFromUri(CFG.modelos),
      faceapi.nets.faceRecognitionNet.loadFromUri(CFG.modelos),
      faceapi.nets.faceExpressionNet.loadFromUri(CFG.modelos),
    ]);
    modelosProntos = true;
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false
  });
  $('video').srcObject = stream;
  $('janela').classList.remove('oculta');
  await $('video').play();
}
function fecharCamera(){
  stream?.getTracks().forEach(t=>t.stop());
  stream = null;
  $('janela').classList.add('oculta');
}

/* ---------- liveness: cumprir as ações que o servidor sorteou ---------- */
async function cumprirDesafio(acoes, prazoMs){
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize:224, scoreThreshold:.5 });
  const video = $('video');
  const trace = [];
  const cumpridas = [];
  let idx = 0;
  const fim = Date.now() + prazoMs;

  let baseYaw = null, baseEar = null, baseArea = null;
  let piscouEm = 0;

  while (idx < acoes.length && Date.now() < fim){
    $('instrucao').textContent = TEXTO_ACAO[acoes[idx]];
    $('contador').textContent = Math.ceil((fim - Date.now())/1000) + 's';

    const det = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceExpressions();
    if (!det){ $('instrucao').textContent = 'Enquadre o rosto'; await espera(90); continue; }

    const p = det.landmarks.positions;
    const yaw = yawGraus(p);
    const e = (ear(p,'esq') + ear(p,'dir'))/2;
    const area = det.detection.box.area / (video.videoWidth * video.videoHeight);

    trace.push({ t: Date.now(), yaw:+yaw.toFixed(2), ear:+e.toFixed(4), area:+area.toFixed(4) });
    baseYaw ??= yaw; baseEar ??= e; baseArea ??= area;

    let ok = false;
    switch (acoes[idx]){
      case 'virar_direita':  ok = yaw - baseYaw >  16; break;
      case 'virar_esquerda': ok = baseYaw - yaw >  16; break;
      case 'aproximar':      ok = area > baseArea * 1.45; break;
      case 'sorrir':         ok = (det.expressions?.happy ?? 0) > 0.75; break;
      case 'piscar':
        if (e < baseEar * 0.68) piscouEm = Date.now();
        ok = piscouEm && e > baseEar * 0.85 && Date.now() - piscouEm < 1200;
        break;
    }
    if (ok){
      cumpridas.push(acoes[idx]);
      idx++; piscouEm = 0;
      baseYaw = null; baseEar = null; baseArea = null;
      $('instrucao').textContent = 'Isso. Segure firme…';
      await espera(500);
    }
    await espera(70);
  }

  $('contador').textContent = '';
  if (idx < acoes.length) return null;

  // último quadro: descritor + evidência
  $('instrucao').textContent = 'Registrando…';
  const final = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
  if (!final) return null;

  const cv = document.createElement('canvas');
  cv.width = 320; cv.height = 240;
  cv.getContext('2d').drawImage(video, 0, 0, 320, 240);

  return {
    descritor: Array.from(final.descriptor),
    evidencia: cv.toDataURL('image/jpeg', 0.7).split(',')[1],
    liveness: {
      acoes_cumpridas: cumpridas,
      confianca: Math.min(1, trace.length / 24),
      trace: trace.slice(-90),
    },
  };
}
const espera = (ms) => new Promise(r=>setTimeout(r, ms));

/* ---------- localização (opcional, nunca bloqueia) ---------- */
function pegarGeo(){
  return new Promise((resolve)=>{
    if (!navigator.geolocation) return resolve(null);
    const t = setTimeout(()=>resolve(null), 6000);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ clearTimeout(t); resolve({
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        acuracia_m: pos.coords.accuracy,
      });},
      ()=>{ clearTimeout(t); resolve(null); },
      { enableHighAccuracy:true, timeout:5500, maximumAge:0 }
    );
  });
}

/* ---------- fluxo principal ---------- */
$('bater').addEventListener('click', async () => {
  const btn = $('bater'), aviso = $('aviso');
  btn.disabled = true; aviso.className = 'aviso';

  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ location.href = './entrar.html?para=' + encodeURIComponent('./'); return; }
    const auth = { Authorization:`Bearer ${session.access_token}`, 'Content-Type':'application/json' };

    aviso.textContent = 'Abrindo a câmera…';
    btn.textContent = 'Aguarde';
    await abrirCamera();

    const rd = await fetch(`${CFG.supabaseUrl}/functions/v1/desafio-liveness`, { method:'POST', headers:auth });
    if (!rd.ok) throw new Error('Não foi possível abrir o desafio. Tente de novo.');
    const desafio = await rd.json();
    $('pessoa').textContent = desafio.nome;

    const prazo = new Date(desafio.expira_em) - Date.now() - 4000;
    const [prova, geo] = await Promise.all([ cumprirDesafio(desafio.acoes, prazo), pegarGeo() ]);
    if (!prova) throw new Error('Não deu para confirmar o rosto a tempo. Comece de novo.');

    let webauthn = null;
    try{
      webauthn = await startAuthentication({
        optionsJSON:{ challenge: btoa(desafio.nonce).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_'),
                      rpId: location.hostname, userVerification:'required', timeout:20000 }
      });
    }catch{ /* sem passkey: a marcação vale, mas entra em revisão */ }

    const r = await fetch(`${CFG.supabaseUrl}/functions/v1/registrar-ponto`, {
      method:'POST', headers:auth,
      body: JSON.stringify({
        desafio_id: desafio.desafio_id,
        nonce: desafio.nonce,
        descritor_facial: prova.descritor,
        liveness: prova.liveness,
        evidencia_b64: prova.evidencia,
        geo, webauthn,
      }),
    });

    const res = await r.json();
    if (!r.ok) throw new Error(res.erro ?? 'A marcação não foi gravada.');

    fecharCamera();
    mostrarRecibo(res);
    await carregarHoje();

  }catch(e){
    fecharCamera();
    aviso.className = 'aviso erro';
    aviso.textContent = e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Bater ponto';
  }
});

/* ---------- recibo ---------- */
function mostrarRecibo(r){
  const d = new Date(r.marcado_em);
  const f = (o)=>new Intl.DateTimeFormat('pt-BR',{timeZone:CFG.tz,...o}).format(d);

  $('rec-hora').textContent = f({hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('rec-data').textContent = f({weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  $('rec-nsr').textContent  = String(r.nsr).padStart(9,'0');
  $('rec-nome').textContent = r.nome;
  $('rec-hash').textContent = r.hash;

  const selo = $('selo');
  selo.textContent = r.em_revisao ? 'EM REVISÃO' : 'REGISTRADO';
  selo.style.borderColor = selo.style.color = r.em_revisao ? 'var(--alerta)' : 'var(--carimbo)';

  $('rec-revisao').innerHTML = r.em_revisao
    ? `<p class="revisao">A marcação está gravada e vale para a sua jornada.
       A coordenação vai conferir porque ${r.sinais_ok < 2 ? 'não confirmamos vários sinais' : 'um sinal não foi confirmado'}
       — normalmente é sinal de GPS fraco ou 4G no lugar do Wi-Fi da escola.</p>`
    : '';

  $('rec-pdf').onclick = async () => {
    const { data:{ session } } = await sb.auth.getSession();
    const resp = await fetch(r.comprovante_url, { headers:{ Authorization:`Bearer ${session.access_token}` }});
    const url = URL.createObjectURL(await resp.blob());
    Object.assign(document.createElement('a'), { href:url, download:`comprovante-${r.nsr}.pdf` }).click();
    URL.revokeObjectURL(url);
  };

  $('carimbo').classList.add('aberto');
  $('rec-fechar').focus();
}
$('rec-fechar').onclick = () => $('carimbo').classList.remove('aberto');

/* ---------- registro do aparelho (passkey) ----------
   A chave nasce dentro do Secure Enclave deste aparelho e nunca sai dele.
   Por isso ninguém pode registrar o celular de outra pessoa: é o que
   fecha a brecha da senha emprestada. */
async function conferirAparelho(){
  const { data } = await sb.schema('ponto').from('dispositivos')
    .select('id').eq('ativo', true).limit(1);
  const temAparelho = (data ?? []).length > 0;
  $('registrar-aparelho').hidden = temAparelho;
  $('bater').hidden = !temAparelho;
  if (!temAparelho){
    $('aviso').textContent =
      'Antes da primeira marcação, registre este celular. Leva uns 10 segundos.';
  }
  return temAparelho;
}

$('registrar-aparelho').addEventListener('click', async () => {
  const btn = $('registrar-aparelho'), aviso = $('aviso');
  btn.disabled = true; btn.textContent = 'Aguarde…';
  aviso.className = 'aviso';

  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ location.href = './entrar.html?para=' + encodeURIComponent('./'); return; }
    const auth = { Authorization:`Bearer ${session.access_token}`, 'Content-Type':'application/json' };

    const r1 = await fetch(`${CFG.supabaseUrl}/functions/v1/webauthn-registro`, {
      method:'POST', headers:auth, body: JSON.stringify({ etapa:'opcoes' }) });
    const p1 = await r1.json();
    if (!r1.ok) throw new Error(p1.erro);

    const resposta = await startRegistration({ optionsJSON: p1.opcoes });

    const r2 = await fetch(`${CFG.supabaseUrl}/functions/v1/webauthn-registro`, {
      method:'POST', headers:auth,
      body: JSON.stringify({ etapa:'verificar', resposta, apelido: apelidoDoAparelho() }) });
    const p2 = await r2.json();
    if (!r2.ok) throw new Error(p2.erro);

    aviso.textContent = 'Celular registrado. Agora você já pode bater o ponto.';
    await conferirAparelho();
  }catch(e){
    aviso.className = 'aviso erro';
    aviso.textContent = /NotAllowed|abort/i.test(e.message ?? '')
      ? 'Registro cancelado. Toque de novo e confirme com a digital ou o PIN do aparelho.'
      : e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Registrar este celular';
  }
});

function apelidoDoAparelho(){
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua))   return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  return 'Aparelho';
}

/* ---------- marcações do dia ---------- */
async function carregarHoje(){
  const inicio = new Date(); inicio.setHours(0,0,0,0);
  const { data } = await sb.schema('ponto').from('v_espelho')
    .select('nsr, dh_marcacao, sinais_ok, revisao')
    .gte('dh_marcacao', inicio.toISOString())
    .order('dh_marcacao');

  const lista = $('lista');
  if (!data?.length){
    lista.innerHTML = '<p class="vazio">Nenhuma marcação registrada hoje.</p>';
    return;
  }
  lista.innerHTML = data.map(m => {
    const h = new Intl.DateTimeFormat('pt-BR',{timeZone:CFG.tz,hour:'2-digit',minute:'2-digit',hour12:false})
      .format(new Date(m.dh_marcacao));
    const rev = m.revisao === 'pendente';
    return `<div class="batida">
      <span>${h}</span>
      <span class="nsr">NSR ${String(m.nsr).padStart(9,'0')}</span>
      <span class="sinal ${rev?'rev':'ok'}">${rev?'em revisão':'confirmada'}</span>
    </div>`;
  }).join('');
}

/* ---------- boot ---------- */
(async () => {
  await sincronizarRelogio().catch(()=>{});
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ location.href = './entrar.html?para=' + encodeURIComponent('./'); return; }
  const { data: eu } = await sb.schema('ponto').from('empregados').select('nome').maybeSingle();
  if (eu) $('pessoa').textContent = eu.nome;
  await carregarHoje();
  await conferirAparelho();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
